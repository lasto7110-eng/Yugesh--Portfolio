<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#17191c;background:#f3f4f5}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #ddd;padding:20px max(20px,calc((100vw - 1000px)/2));display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}h2{font-size:19px}.accent{color:#ff4b32}.wrap{max-width:1000px;margin:30px auto;padding:0 18px}.panel{background:white;border:1px solid #e5e5e5;border-radius:16px;padding:24px;margin-bottom:20px}label{display:block;font-weight:600;font-size:13px;margin:15px 0 6px}input,textarea,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font:inherit;background:#fff}textarea{min-height:90px}button{border:0;border-radius:9px;padding:12px 18px;background:#ff4b32;color:white;font-weight:700;cursor:pointer}button.secondary{background:#17191c}button.outline{background:#fff;color:#17191c;border:1px solid #ddd}button:disabled{opacity:.5;cursor:wait}.flex{display:flex;gap:10px;flex-wrap:wrap}.flex>*{flex:1}.hide{display:none!important}.item{border-top:1px solid #eee;padding:15px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:#666;font-size:13px}.msg{white-space:pre-wrap;margin-top:12px;font-size:14px}.preview{max-width:160px;max-height:110px;object-fit:cover;border-radius:8px;margin-top:10px}a{color:#ff4b32}small{color:#666}</style></head><body>
<header><h1>Yugesh <span class="accent">Admin</span></h1><button id="logout" class="secondary hide">Log out</button></header>
<main class="wrap"><section id="loginPanel" class="panel"><h2>Admin login</h2><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit">Sign in</button></p></form><p id="loginMsg" class="msg" role="status"></p></section>
<section id="dashboard" class="hide"><div class="panel"><h2 id="formTitle">Add portfolio content</h2><form id="itemForm"><input id="editId" type="hidden"><label>Type</label><select id="category"><option value="project">Project</option><option value="video">Video</option><option value="certificate">Certificate</option></select><label>Title</label><input id="title" maxlength="150" required><label>Description</label><textarea id="description"></textarea><label>Image / thumbnail upload (50 MB maximum)</label><input id="imageFile" type="file" accept="image/*"><small>Upload a new image, or keep the existing one when editing.</small><label>Image URL (optional)</label><input id="imageUrl" type="url" placeholder="https://..."><label>Video URL or certificate link (optional)</label><input id="videoUrl" type="url" placeholder="https://..."><p class="flex"><button id="saveBtn" type="submit">Save content</button><button id="cancelEdit" type="button" class="outline">Clear / Cancel edit</button></p></form><p id="saveMsg" class="msg" role="status"></p></div><div class="panel"><h2>Manage content</h2><div id="items">Loading...</div></div><p class="muted">Changes are stored in Supabase. Only the configured admin account can write data. Your existing hardcoded portfolio entries remain on the website.</p></section></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL="https://arzkjiblnrvunqobunjk.supabase.co";
const SUPABASE_KEY="sb_publishable_TK8EyJcuJKN4fCWq6cpIVQ_c5abN9wn";
const ADMIN_UID='cf3829b8-85aa-4826-8174-013571b7a6bb';
const db=createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let rows=[];
const msg=(id,s)=>$(id).textContent=s;
function reset(){ $('itemForm').reset();$('editId').value='';$('formTitle').textContent='Add portfolio content';msg('saveMsg','') }
async function refresh(){const {data,error}=await db.from('portfolio_items').select('*').order('created_at',{ascending:false});if(error){msg('items',error.message);return}rows=data||[];$('items').replaceChildren();if(!rows.length){msg('items','No uploaded items yet.');return}rows.forEach(x=>{const d=document.createElement('div');d.className='item';const left=document.createElement('div');const strong=document.createElement('strong');strong.textContent=x.title;const p=document.createElement('div');p.className='muted';p.textContent=x.category+' · '+(x.description||'').slice(0,90);left.append(strong,p);const actions=document.createElement('div');actions.className='flex';const edit=document.createElement('button');edit.className='outline';edit.textContent='Edit';edit.onclick=()=>{ $('editId').value=x.id;$('category').value=x.category;$('title').value=x.title;$('description').value=x.description||'';$('imageUrl').value=x.image_url||'';$('videoUrl').value=x.video_url||'';$('formTitle').textContent='Edit content';window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='secondary';del.textContent='Delete';del.onclick=async()=>{if(!confirm('Delete '+x.title+'?'))return;del.disabled=true;const {error}=await db.from('portfolio_items').delete().eq('id',x.id);if(error){alert(error.message);del.disabled=false}else await refresh()};actions.append(edit,del);d.append(left,actions);$('items').append(d)})}
async function sync(){const {data:{user}}=await db.auth.getUser();const valid=user?.id===ADMIN_UID;$('loginPanel').classList.toggle('hide',valid);$('dashboard').classList.toggle('hide',!valid);$('logout').classList.toggle('hide',!user);if(valid)await refresh();else if(user)msg('loginMsg','This account is not authorized as portfolio admin.');}
$('loginForm').onsubmit=async e=>{e.preventDefault();msg('loginMsg','Signing in...');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){msg('loginMsg',error.message);return}msg('loginMsg','');$('password').value='';await sync()};
$('logout').onclick=async()=>{await db.auth.signOut();await sync()};$('cancelEdit').onclick=reset;
$('itemForm').onsubmit=async e=>{e.preventDefault();const btn=$('saveBtn');btn.disabled=true;msg('saveMsg','Saving...');try{let image=$('imageUrl').value.trim()||null;const f=$('imageFile').files[0];if(f){if(!f.type.startsWith('image/'))throw Error('Please select an image file.');if(f.size>50*1024*1024)throw Error('Image exceeds 50 MB.');const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');const path=crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('portfolio-media').upload(path,f,{contentType:f.type,upsert:false});if(error)throw error;image=db.storage.from('portfolio-media').getPublicUrl(path).data.publicUrl}
const payload={category:$('category').value,title:$('title').value.trim(),description:$('description').value.trim(),image_url:image,video_url:$('videoUrl').value.trim()||null};const id=$('editId').value;const result=id?await db.from('portfolio_items').update(payload).eq('id',id):await db.from('portfolio_items').insert(payload);if(result.error)throw result.error;reset();msg('saveMsg','Saved successfully!');await refresh()}catch(err){msg('saveMsg','Error: '+err.message)}finally{btn.disabled=false}};
await sync();
</script></body></html>
